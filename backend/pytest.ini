[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app,evaluation
omit =
    app/rag/*
    app/worker.py
    app/jobs/*
    app/core/ollama.py
    app/core/llm.py
    app/main.py
    app/services/ingestion_service.py
    app/services/rag_service.py
    app/services/hybrid_search.py
    app/services/document_loaders.py
    app/services/documents_services.py
    app/services/embedding_service.py
    app/services/oauth_service.py
    app/api/oauth_routes.py
    app/tools/web_search_tool.py
    app/tools/retrieval.py
    app/db/migrations.py
    app/db/session.py
    evaluation/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
fail_under = 80
show_missing = True
